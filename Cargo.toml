[package]
name = "moget"
version = "0.10.0"
edition = "2024"
description = "Video file downloader"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aes = "0.9.4"
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.2"
cbc = "0.2.1"
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
indicatif = "0.18.6"
m3u8-rs = "6.0.1"
reqwest = { version = "0.13.5", features = ["brotli", "deflate", "gzip", "json", "socks"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_urlencoded = "0.7.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util", "retry"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
